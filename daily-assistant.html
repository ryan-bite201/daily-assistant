<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Everything is inlined into this one file at build time, so the policy
         allows inline script/style and blocks every external origin. connect-src
         stays open to https: for the Gist sync, calendar relay, and the push
         relay Worker's /subscribe + /health calls. worker-src 'self' permits
         registering sw.js (offline caching + Web Push, see public/sw.js);
         manifest-src 'self' permits <link rel="manifest"> — default-src 'none'
         would otherwise block the manifest, and iOS needs it to deliver push
         to a home-screen app. script-src is deliberately left at
         'unsafe-inline' only, since nothing else the app does needs a
         separately-loaded script file. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none';"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Assistant" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Web App Manifest — the second deliberate exception to CLAUDE.md's "one
         output file" rule (public/sw.js is the first). iOS 16.4+ delivers Web
         Push only to a home-screen app whose manifest requests display:
         standalone; the legacy apple-mobile-web-app-capable meta above is not
         sufficient on its own. Generated by scripts/gen-manifest.cjs with its
         icons inlined as data: URIs, so the build still emits one HTML plus two
         verbatim public/ files. Kept as a real file (not a data: URI on this
         link) because iOS Safari does not reliably honor data-URI manifests. -->
    <link rel="manifest" href="./manifest.webmanifest" />

         colors (assets/apple-touch-icon.png is the same PNG, kept for

         file to upload. Also doubles as the favicon, so nothing asks the
         server for /favicon.ico. -->

         survive completely untouched by vite-plugin-singlefile's inlining

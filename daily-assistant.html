    <!-- Plain inline script, not inside the module bundle above — this must
         survive completely untouched by vite-plugin-singlefile's inlining
         pass (it already is inline, so there's nothing for that plugin to
         do), and must run independently of the React app's own lifecycle.
         Registering sw.js is what makes offline loading work at all after
         iOS fully kills the app's process; see public/sw.js. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {
            // No connection, or some other registration failure — the app
            // still loaded fine just now (this script only runs after a
            // successful load), so this is silently skipped rather than
            // shown to the user. It retries automatically on the next
            // successful load.
          });
        });
